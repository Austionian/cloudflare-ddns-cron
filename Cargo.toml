[package]
name = "cloudflare-ddns-cron"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dependencies.openssl-sys]
version = "0.9"
features = ["vendored"]

[lints.clippy]
pedantic = { level = "warn" }
